<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Swasya Ecosystem | 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --swasya-green: #2D5A27;
            --accent-gold: #C5A028;
            --sidebar-dark: #121412;
            --bg-light: #F4F7F4;
            --glow-green: rgba(45, 90, 39, 0.4);
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        input, select, textarea, .btn-pill {
            border-radius: 50px;
            padding: 12px 18px;
            border: 1px solid #E2E8F0;
            background: white;
            font-size: 0.9rem;
            transition: all 0.2s;
            outline: none;
            max-width: 100%;
        }

        textarea {
            border-radius: 18px;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--swasya-green);
            box-shadow: 0 0 0 3px rgba(45, 90, 39, 0.1);
        }

        .btn-pill {
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-pill:active {
            transform: scale(0.98);
        }

        .btn-green {
            background: var(--swasya-green);
            color: white;
        }

        .btn-gold {
            background: var(--accent-gold);
            color: white;
        }

        /* Login Screen */
        #login-screen {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                        url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&q=80&w=2560');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 4vw, 32px);
            overflow-y: auto;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: clamp(28px, 6vw, 50px) clamp(22px, 5vw, 45px);
            border-radius: clamp(24px, 5vw, 40px);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            margin: auto;
        }

        .sys-logo {
            width: min(300px, 100%);
            height: auto;
            max-height: 150px;
            object-fit: contain;
            border-radius: 20px;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.3));
        }

        /* Mobile Sidebar Backdrop & Drawer Trigger */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(2px);
            z-index: 890;
        }

        .sidebar-backdrop.active {
            display: block;
        }

        .mobile-menu-btn {
            display: none;
            background: var(--sidebar-dark);
            color: white;
            border: none;
            border-radius: 14px;
            width: 42px;
            height: 42px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sidebar-close-btn {
            display: none;
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        /* Sidebar */
        .sidebar {
            width: 340px;
            min-width: 340px;
            background: var(--sidebar-dark);
            color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid #ddd;
            z-index: 900;
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sb-header {
            position: relative;
            padding: 24px 20px 18px;
            text-align: center;
        }

        .sb-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
            -webkit-overflow-scrolling: touch;
        }

        .sb-divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 24px 0 14px;
            position: relative;
        }

        .sb-label {
            font-size: 0.6rem;
            color: var(--accent-gold);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: absolute;
            top: -8px;
            left: 10px;
            background: var(--sidebar-dark);
            padding: 0 8px;
        }

        .data-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 15px;
            margin-top: 5px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #date-display-header {
            font-size: 1.05rem;
            font-weight: 800;
            color: white;
            margin-bottom: 12px;
            display: block;
        }

        .avail-badge {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            margin-bottom: 6px;
        }

        .avail-badge:last-child {
            margin-bottom: 0;
        }

        .avail-count {
            font-weight: 800;
            color: var(--accent-gold);
        }

        .load-box {
            background: rgba(45, 90, 39, 0.15);
            border: 1px solid rgba(45, 90, 39, 0.3);
            border-radius: 16px;
            padding: 15px;
        }

        .load-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .load-row:last-child {
            margin-bottom: 0;
            padding-top: 6px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .load-val {
            color: var(--accent-gold);
            font-weight: 800;
        }

        .visit-card {
            background: rgba(255,255,255,0.08);
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 18px;
            border-left: 4px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .visit-card:hover {
            background: rgba(255,255,255,0.12);
        }

        .status-tag {
            font-size: 0.55rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* Main Content Area */
        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 18px clamp(16px, 3vw, 40px);
            background: white;
            border-bottom: 1px solid #EEE;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }

        .header-title-group {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        #main-project-heading {
            margin: 0;
            color: var(--swasya-green);
            font-weight: 800;
            font-size: clamp(1.1rem, 2.2vw, 1.5rem);
            line-height: 1.2;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        #live-pricing-display {
            font-weight: 800;
            color: var(--accent-gold);
            padding-right: 6px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        #global-search {
            width: 240px;
            max-width: 100%;
            border: 2px solid var(--swasya-green);
        }

        .booking-form-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: #F8FAFC;
            padding: clamp(12px, 2vw, 18px);
            border-radius: 24px;
            border: 1px solid #E2E8F0;
            align-items: center;
        }

        .booking-form-bar > input,
        .booking-form-bar > select,
        .booking-form-bar > div {
            min-width: 0;
        }

        .f-name { flex: 1.5 1 160px; }
        .f-phone { flex: 1.2 1 140px; }
        .f-linkedin { flex: 1.2 1 150px; }
        .f-cust-type { flex: 0.9 1 145px; font-weight: 600; }
        .f-pax { flex: 0.6 1 85px; }
        .f-kids { flex: 0.6 1 85px; }
        .f-date { flex: 0.9 1 135px; }
        .f-collected { flex: 0.8 1 120px; }
        .f-pending { flex: 0.8 1 115px; background: #f1f5f9 !important; }
        .f-food-wrap { flex: 0.7 1 115px; display: flex; }
        .f-food-wrap select { width: 100%; }
        .f-unit { flex: 1 1 140px; }
        .f-unit-count { flex: 0.7 1 115px; }
        .f-submit { padding: 12px 24px; flex: 0 1 auto; }

        .calendar-scroll-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            padding: 18px clamp(14px, 3vw, 40px) 28px;
            -webkit-overflow-scrolling: touch;
        }

        .calendar-month-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            min-width: 280px;
        }

        #calendar-month-year {
            margin: 0;
            color: var(--swasya-green);
            font-weight: 800;
            text-transform: uppercase;
            font-size: clamp(1rem, 2.2vw, 1.45rem);
            text-align: center;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 1px;
            background: #E2E8F0;
            border-radius: 20px;
            overflow: hidden;
            min-width: 620px;
        }

        .cal-day {
            background: white;
            min-height: clamp(85px, 13vh, 125px);
            padding: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            overflow-y: auto;
        }

        .cal-day.empty {
            background: #fdfdfd;
            cursor: default;
        }

        .cal-day.selected {
            background: #F0FDF4;
            box-shadow: inset 0 0 0 2px var(--swasya-green);
            z-index: 2;
        }

        .cal-head {
            background: #F8FAFC;
            padding: 12px 8px;
            text-align: center;
            font-weight: 800;
            font-size: 0.7rem;
            color: #64748B;
        }

        .visit-dot {
            font-size: 0.58rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 3px;
            color: white;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hidden {
            display: none !important;
        }

        .modal-active {
            display: flex !important;
        }

        #custom-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: clamp(12px, 3vw, 24px);
            overflow-y: auto;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: clamp(22px, 4vw, 32px);
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            margin: auto;
            max-height: 90dvh;
            display: flex;
            flex-direction: column;
        }

        .modal-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            font-size: 0.85rem;
        }

        .waitlist-tag {
            background: #64748B !important;
            color: white;
        }

        .nav-btn {
            background: #f0f0f0;
            border: none;
            padding: 7px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            color: var(--swasya-green);
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: #e0e0e0;
        }

        .active-proj-btn {
            background: var(--swasya-green) !important;
            box-shadow: 0 0 15px var(--glow-green);
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }

        .calendar-scroll-area::-webkit-scrollbar-thumb {
            background: rgba(45, 90, 39, 0.25);
        }

        .sb-footer {
            padding: 18px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
        }

        .linkedin-link {
            position: absolute;
            right: 14px;
            top: 14px;
            color: #0A66C2;
            background: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
        }

        /* Tablet & Mobile Drawer Behavior (iPhone, Android, small tablets) */
        @media (max-width: 1024px) {
            body {
                height: auto;
                min-height: 100vh;
                min-height: 100dvh;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .mobile-menu-btn,
            .sidebar-close-btn {
                display: inline-flex;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                height: 100vh;
                height: 100dvh;
                width: min(340px, 86vw);
                min-width: 0;
                transform: translateX(-100%);
                box-shadow: 12px 0 35px rgba(0, 0, 0, 0.45);
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .main {
                width: 100%;
                height: auto;
                min-height: 100vh;
                min-height: 100dvh;
                overflow: visible;
            }

            .calendar-scroll-area {
                overflow: visible;
                flex: initial;
            }
        }

        /* Phone Layout Refinements */
        @media (max-width: 640px) {
            input, select, textarea, .btn-pill {
                font-size: 16px; /* Prevents iOS auto-zoom on input focus */
                padding: 11px 16px;
            }

            .header-controls {
                width: 100%;
            }

            #global-search,
            #proj-select {
                flex: 1 1 150px;
            }

            #live-pricing-display {
                width: 100%;
                padding-right: 0;
                font-size: 0.85rem;
            }

            .booking-form-bar {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                border-radius: 20px;
            }

            .f-name,
            .f-phone,
            .f-linkedin,
            .f-cust-type,
            .f-food-wrap,
            .f-unit,
            .f-submit {
                grid-column: 1 / -1;
                flex: none;
                width: 100% !important;
            }

            .f-pax,
            .f-kids,
            .f-date,
            .f-collected,
            .f-pending,
            .f-unit-count {
                flex: none;
                width: 100% !important;
            }

            .modal-grid-2 {
                grid-template-columns: 1fr;
                gap: 10px;
            }
        }
    </style>
</head>
<body onkeydown="handleGlobalKey(event)">

<div id="login-screen">
    <div class="login-card">
        <img src="Swasya Logo 10.png" alt="Swasya Logo" class="sys-logo">
        <h2 style="color:white; margin:14px 0 10px; font-weight:800; letter-spacing: 1px;">INVENTORY</h2>
        <h3 style="color:var(--accent-gold); margin-bottom:28px; font-weight:400; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 4px;">Management Portal</h3>
        <input type="text" id="username" placeholder="Username" autocomplete="username" style="width: 100%; margin-bottom: 15px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" style="width: 100%; margin-bottom: 25px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
        <button class="btn-pill btn-green" style="width: 100%; padding: 18px; letter-spacing: 2px;" onclick="doLogin()">Authenticate</button>
        <p style="color: rgba(255,255,255,0.4); font-size: 0.65rem; margin-top: 25px; font-weight: 600;">SECURED BY SWASYA ECOSYSTEM 2026</p>
    </div>
</div>

<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleMobileSidebar(false)"></div>

<div class="sidebar hidden" id="sidebar">
    <div class="sb-header">
        <button type="button" class="sidebar-close-btn" aria-label="Close menu" onclick="toggleMobileSidebar(false)">✕</button>
        <img src="Swasya Logo 3.png" alt="Logo" style="width: 90px; max-width: 100%; margin-bottom: 10px;">
        <span id="u-name" style="font-weight: 800; font-size: 1.1rem; display: block;">User</span>
        <span id="u-role" style="font-size: 0.65rem; color: var(--accent-gold); text-transform: uppercase; font-weight: 800; letter-spacing: 1px;">Role</span>
    </div>

    <div class="sb-content">
        <div id="side-inventory-section">
            <div class="sb-divider"><span class="sb-label">Inventory Status</span></div>
            <div class="data-panel">
                <span id="date-display-header"></span>
                <div id="avail-box">
                    <div class="avail-badge"><span>Cottages</span> <span id="count-c" class="avail-count">4/4</span></div>
                    <div class="avail-badge"><span>Glamps</span> <span id="count-g" class="avail-count">1/1</span></div>
                </div>
            </div>
        </div>

        <div id="side-kitchen-section">
            <div class="sb-divider"><span class="sb-label">Kitchen Load</span></div>
            <div class="load-box">
                <div class="load-row"><span>🥗 Veg Meals</span> <span id="veg-val" class="load-val">0</span></div>
                <div class="load-row" id="nv-row"><span>🍖 Non-Veg Meals</span> <span id="nv-val" class="load-val">0</span></div>
                <div class="load-row"><span>👥 Total Visits</span> <span id="pax-val" class="load-val">0</span></div>
            </div>
        </div>

        <div class="sb-divider"><span class="sb-label">Booking Logistics</span></div>
        <div id="project-toggle" style="display: flex; gap: 4px; background: #000; padding: 4px; border-radius: 50px; margin-bottom: 15px;">
            <button type="button" onclick="switchContext('Sannidhi')" id="btn-san" style="flex:1; border:none; border-radius:50px; padding:8px; font-size:0.65rem; cursor:pointer; font-weight:800; color:white; background: transparent;">SANNIDHI</button>
            <button type="button" onclick="switchContext('VanaVida')" id="btn-vv" style="flex:1; border:none; border-radius:50px; padding:8px; font-size:0.65rem; cursor:pointer; font-weight:800; color:white; background: transparent;">VANA VIDA</button>
        </div>
        <div id="date-info-list"></div>

        <div id="audit-panel" class="hidden">
            <div class="sb-divider"><span class="sb-label">Audit & Control</span></div>
            <div class="data-panel" style="background: rgba(197, 160, 40, 0.05); border-color: rgba(197, 160, 40, 0.2);">
                <button type="button" class="btn-pill btn-gold" style="width:100%; font-size:0.65rem; margin-bottom: 8px; padding: 10px;" onclick="openAddUserModal()">👤 Manage Team</button>
                <button type="button" class="btn-pill btn-green" style="width:100%; font-size:0.65rem; padding: 10px;" onclick="exportAuditToExcel()">📊 Export Audit (.CSV)</button>
            </div>
        </div>
    </div>

    <div class="sb-footer">
        <button type="button" onclick="location.reload()" style="width:100%; background:none; border:none; color:rgba(255,255,255,0.4); font-size: 0.65rem; cursor:pointer; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;">
            Sign Out
        </button>
    </div>
</div>

<div class="main hidden" id="main-area">
    <header>
        <div class="header-top">
            <div class="header-title-group">
                <button type="button" class="mobile-menu-btn" aria-label="Open menu" onclick="toggleMobileSidebar(true)">☰</button>
                <h3 id="main-project-heading">Sannidhi Eco Farm Bookings</h3>
            </div>
            <div class="header-controls">
                <div id="live-pricing-display"></div>
                <input type="text" id="global-search" placeholder="🔍 Search Name/Phone..." oninput="updateUI()">
                <select id="proj-select" onchange="syncProjectState(this.value)" style="font-weight: 800;">
                    <option value="Sannidhi">Sannidhi Eco Farms</option>
                    <option value="VanaVida">Vana Vida</option>
                </select>
            </div>
        </div>

        <div class="booking-form-bar">
            <input type="text" id="c-name" class="f-name" placeholder="Client Name *">
            <input type="text" id="c-phone" class="f-phone" placeholder="Phone Number *">
            <input type="url" id="c-linkedin" class="f-linkedin" placeholder="LinkedIn URL *">

            <select id="c-cust-type" class="f-cust-type" onchange="calculatePrice()">
                <option value="New">New Visit</option>
                <option value="Existing">Existing Customer</option>
            </select>

            <input type="number" id="c-pax" class="f-pax" placeholder="Adults *" oninput="calculatePrice()">
            <input type="number" id="c-kids" class="f-kids" placeholder="Kids *" oninput="calculatePrice()">

            <input type="date" id="c-checkin" class="f-date" onchange="updateCheckOutMin(); calculatePrice();">

    function calculateNights() {
        const inStr = document.getElementById('c-checkin').value;
        const outStr = document.getElementById('c-checkout').value;
        if (inStr && outStr) {
            const dIn = new Date(inStr);
            const dOut = new Date(outStr);
            const diffTime = dOut - dIn;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays > 0 ? diffDays : 1;
        }
        return 1;
    }

    function calculatePrice() {
        const type = document.getElementById('c-cust-type').value;
        const adults = parseInt(document.getElementById('c-pax').value) || 0;
        const kids = parseInt(document.getElementById('c-kids').value) || 0;
        const nights = calculateNights();
        const collected = parseFloat(document.getElementById('c-collected').value) || 0;

        let total = 0;
        if (type === 'Existing') {
            total = (adults + kids) * 2500 * nights;
        } else {
            const firstNightAdults = adults * 1500;
            const extraNightsAdults = adults * 2500 * (nights - 1);

            const firstNightKids = kids * 1000;
            const extraNightsKids = kids * 1250 * (nights - 1);

            total = firstNightAdults + extraNightsAdults + firstNightKids + extraNightsKids;
        }

        const pending = Math.max(0, total - collected);
        document.getElementById('c-pending').value = pending;
        document.getElementById('live-pricing-display').innerText = `Total: ₹${total.toLocaleString('en-IN')} (${nights} Night${nights > 1 ? 's' : ''})`;
        return total;
    }

    function isDateInStayRange(targetDate, checkIn, checkOut) {
        if (!checkIn) return false;
        const target = new Date(targetDate);
        const start = new Date(checkIn);
        const end = checkOut ? new Date(checkOut) : new Date(start.getTime() + 86400000);
        return target >= start && target < end;
    }

    function updateUI() {
        const grid = document.getElementById('cal-grid');
        if (!grid) return;
        grid.innerHTML = '';
        ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(h => grid.innerHTML += `<div class="cal-head">${h}</div>`);
        const year = currentViewDate.getFullYear(), month = currentViewDate.getMonth();
        document.getElementById('calendar-month-year').innerText = `${currentViewDate.toLocaleString('default', {month:'long'})} ${year}`;
        const first = new Date(year, month, 1).getDay();
        const days = new Date(year, month + 1, 0).getDate();
        const offset = first === 0 ? 6 : first - 1;
        const search = document.getElementById('global-search').value.toLowerCase();

        for (let i = 0; i < offset; i++) grid.innerHTML += `<div class="cal-day empty"></div>`;
        for (let d = 1; d <= days; d++) {
            const dStr = `${year}-${(month+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;

            const dayVisits = visits.filter(v =>
                isDateInStayRange(dStr, v.checkIn || v.date, v.checkOut) &&
                v.proj === activeContextProj &&
                (v.client.toLowerCase().includes(search) || (v.phone && v.phone.includes(search)))
            );

            let html = `<div class="cal-day ${dStr === selectedDate ? 'selected' : ''}" onclick="focusDate('${dStr}')"><strong>${d}</strong>`;

            dayVisits.forEach(v => {
                const unitDots = getAssignedUnitDots(v, visits, dStr);
                unitDots.forEach(unitBadge => {
                    const isWait = unitBadge.includes('WAIT');
                    html += `<div class="visit-dot ${isWait?'waitlist-tag':''}" style="background:${isWait?'':v.color}">${unitBadge}: ${v.client.substring(0,8)}</div>`;
                });
            });
            grid.innerHTML += html + `</div>`;
        }
        refreshSideData();
    }

    function getAssignedUnitDots(visit, allVisits, targetDate) {
        if (visit.proj === 'VanaVida') return ['VV'];
        if (visit.unitType === 'Day Visit') return ['DV'];

        const activeVisits = allVisits.filter(v =>
            v.proj === 'Sannidhi' && isDateInStayRange(targetDate, v.checkIn || v.date, v.checkOut)
        ).sort((a,b) => a.id - b.id);

        if (visit.unitType === 'All') {
            return ['C1', 'C2', 'C3', 'C4', 'G'];
        }

        if (visit.unitType === 'Cottage') {
            let cottageCounter = 0;
            let assignedUnits = [];
            const countRequested = visit.unitsCount || 1;

            for (let b of activeVisits) {
                let unitsForThisBooking = 0;
                if (b.unitType === 'Cottage') unitsForThisBooking = b.unitsCount || 1;
                else if (b.unitType === 'All') unitsForThisBooking = 4;

                if (b.id === visit.id) {
                    for (let i = 0; i < countRequested; i++) {
                        cottageCounter++;
                        if (cottageCounter <= 4) assignedUnits.push(`C${cottageCounter}`);
                        else assignedUnits.push(`WAIT`);
                    }
                    return assignedUnits;
                } else {
                    cottageCounter += unitsForThisBooking;
                }
            }
        }

        if (visit.unitType === 'Glamp') {
            const glampBookings = activeVisits.filter(v => v.unitType === 'Glamp' || v.unitType === 'All');
            return glampBookings[0] && glampBookings[0].id === visit.id ? ['G'] : ['WAIT'];
        }

        return ['V'];
    }

    function refreshSideData() {
        const opts = { day: 'numeric', month: 'short', year: 'numeric' };
        if (activeContextProj === 'Sannidhi') document.getElementById('date-display-header').innerText = new Date(selectedDate).toLocaleDateString('en-GB', opts);

        const ctxData = visits.filter(v =>
            isDateInStayRange(selectedDate, v.checkIn || v.date, v.checkOut) &&
            v.proj === activeContextProj
        );

        let confirmedPax = 0, vegCount = 0, nvCount = 0;
        let cB = 0, gB = 0;

        ctxData.forEach(v => {
            const dots = getAssignedUnitDots(v, visits, selectedDate);
            const hasConfirmed = dots.some(d => !d.includes('WAIT'));
            if (hasConfirmed) {
                const p = parseInt(v.pax) || 0;
                confirmedPax += p;
                if (v.foodPref === 'Veg') vegCount += p;
                else if (v.foodPref === 'Non-Veg') nvCount += p;

                dots.forEach(d => {
                    if (d.startsWith('C')) cB++;
                    if (d === 'G') gB++;
                });
            }
        });

        document.getElementById('pax-val').innerText = confirmedPax;
        document.getElementById('veg-val').innerText = vegCount;
        document.getElementById('nv-val').innerText = nvCount;

        const bS = document.getElementById('btn-san'), bV = document.getElementById('btn-vv');
        if (activeContextProj === 'Sannidhi') {
            bS.classList.add('active-proj-btn');
            bV.classList.remove('active-proj-btn');
            document.getElementById('count-c').innerText = `${Math.max(0, 4 - cB)} Available`;
            document.getElementById('count-g').innerText = `${Math.max(0, 1 - gB)} Available`;
        } else {
            bV.classList.add('active-proj-btn');
            bS.classList.remove('active-proj-btn');
        }

        document.getElementById('date-info-list').innerHTML = ctxData.map(v => `
            <div class="visit-card" style="border-left-color:${v.color}" onclick="showFeedbackPrompt(${v.id})">
                ${v.linkedin ? `<a href="${v.linkedin}" target="_blank" rel="noopener noreferrer" class="linkedin-link" onclick="event.stopPropagation()">in</a>` : ''}
                <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding-right:30px;">
                    <b style="font-size:0.8rem; word-break:break-word;">${v.unitType==='All'?'ALL':v.unitType}${v.unitType==='Cottage' && v.unitsCount > 1 ? ` (${v.unitsCount})` : ''}: ${v.client}</b>
                    <span class="status-tag" style="background:${v.status==='Visited'?'#4ade8022':'#fbbf2422'}; color:${v.status==='Visited'?'#4ade80':'#fbbf24'}">${v.status}</span>
                </div>
                <div style="font-size:0.65rem; color:var(--swasya-green); font-weight:800; margin-top:2px;">${v.phone || ''}</div>
                <div style="font-size:0.65rem; opacity:0.7;">Pax: ${v.pax} | ${v.manager}</div>
                <div style="margin-top:8px; display:flex; gap:5px; flex-wrap:wrap;">
                    ${(session.id === 'chetan' || session.id === 'hoysala' || session.id === 'apeksh' || session.id === 'aryan' || session.id === 'akshith') ? `<button type="button" class="btn-pill" style="font-size:0.5rem; padding:4px 8px; background:#222; color:white;" onclick="event.stopPropagation(); updateStatus(${v.id})">LOG</button>` : ''}
                    ${(v.mgrId === session.id || session.id === 'akshith') ? `<button type="button" class="btn-pill" style="font-size:0.5rem; padding:4px 8px; background:#fee2e2; color:#ef4444;" onclick="event.stopPropagation(); deleteVisit(${v.id})">DELETE</button>` : ''}
                </div>
            </div>`).join('') || '<p style="opacity:0.4; text-align:center; padding:20px; font-size:0.8rem;">No visits found.</p>';
    }

    async function openAddUserModal() {
        const modalBody = document.getElementById('modal-body');
        const actionBtn = document.getElementById('modal-action-btn');
        document.getElementById('modal-title').innerText = "Team Management";
        document.getElementById('modal-subtitle').innerText = "Audit & Control";
        actionBtn.style.display = 'inline-flex';
        actionBtn.innerText = "Add Member";
        let userListHtml = TEAM.map(t => `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #eee; font-size:0.8rem;">
                <span><b>${t.name}</b> (${t.role})</span>
                ${t.id !== 'akshith' ? `<button type="button" onclick="deleteUser('${t.id}')" style="background:none; border:none; color:red; cursor:pointer; font-size:0.7rem; font-weight:800;">REMOVE</button>` : ''}
            </div>`).join('');
        modalBody.innerHTML = `
            <div style="margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:15px;">
                <label style="font-size:0.6rem; font-weight:800; color:var(--accent-gold); display:block; margin-bottom:10px;">REGISTER NEW STAFF</label>
                <input type="text" id="new-name" placeholder="Full Name" style="width:100%; margin-bottom:10px;">
                <input type="text" id="new-id" placeholder="Username" style="width:100%; margin-bottom:10px;">
                <select id="new-role" style="width:100%;">
                    <option value="Sales Manager">Sales Manager</option>
                    <option value="Project Manager">Project Manager</option>
                    <option value="CRM">CRM</option>
                </select>
            </div>
            <label style="font-size:0.6rem; font-weight:800; color:var(--accent-gold); display:block; margin-bottom:10px;">EXISTING TEAM</label>
            <div>${userListHtml}</div>`;

        actionBtn.onclick = async () => {
            const name = document.getElementById('new-name').value;
            const id = document.getElementById('new-id').value.toLowerCase().trim();
            const role = document.getElementById('new-role').value;
            if (!name || !id) return;
            if (TEAM.find(t => t.id === id)) return alert("Username exists");
            const colors = ["#2c3e50", "#8e44ad", "#2980b9", "#27ae60", "#d35400", "#c0392b"];
            const newUser = {id, name, role, color: colors[Math.floor(Math.random()*colors.length)]};
            TEAM.push(newUser);
            if (isSupabaseConnected) await supabaseClient.from('team').insert([newUser]);
            localStorage.setItem('swasya_team_v2', JSON.stringify(TEAM));
            openAddUserModal();
        };
        document.getElementById('custom-modal').classList.add('modal-active');
        document.getElementById('custom-modal').classList.remove('hidden');
    }

    async function deleteUser(id) {
        if (!confirm("Remove user?")) return;
        TEAM = TEAM.filter(t => t.id !== id);
        if (isSupabaseConnected) await supabaseClient.from('team').delete().eq('id', id);
        localStorage.setItem('swasya_team_v2', JSON.stringify(TEAM));
        openAddUserModal();
    }

    function showFeedbackPrompt(id) {
        const v = visits.find(v => v.id === id);
        const modalBody = document.getElementById('modal-body');
        document.getElementById('modal-title').innerText = v.client;
        document.getElementById('modal-subtitle').innerText = "Client Complete Log";
        document.getElementById('modal-action-btn').style.display = 'none';

        let unitText = v.unitType;
        if (v.unitType === 'All') unitText = "Entire Property (4 Cottages + 1 Glamp)";
        else if (v.unitType === 'Cottage') unitText = `Cottage (${v.unitsCount} Units)`;

        modalBody.innerHTML = `
            <div class="modal-grid-2">
                <div><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">CLIENT NAME</label><div style="font-weight:700; word-break:break-word;">${v.client}</div></div>
                <div><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">PHONE</label><div style="font-weight:700; color:var(--swasya-green); word-break:break-word;">${v.phone || 'N/A'}</div></div>

                <div><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">CUSTOMER TYPE</label><div style="font-weight:700;">${v.custType || 'N/A'}</div></div>
                <div><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">CHECK-IN / CHECK-OUT</label><div style="font-weight:700;">In: ${v.checkIn || v.date} <br>Out: ${v.checkOut || 'N/A'}</div></div>

                <div><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">PAX BREAKDOWN</label><div style="font-weight:700;">Adults: ${v.adults || 0} | Kids: ${v.kids || 0} (Total: ${v.pax})</div></div>
                <div><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">TOTAL DURATION</label><div style="font-weight:700;">${v.nights || 1} Night(s)</div></div>

                <div><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">UNIT TYPE / QTY</label><div style="font-weight:700;">${unitText}</div></div>
                <div><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">PROJECT / MANAGER</label><div style="font-weight:700;">${v.proj} (${v.manager})</div></div>

                <div style="background:#F0FDF4; padding:10px; border-radius:12px; border:1px solid #bbf7d0;"><label style="display:block; font-size:0.6rem; font-weight:800; color:var(--swasya-green);">TOTAL AMOUNT</label><div style="font-weight:800; font-size:1rem; color:var(--swasya-green);">₹${v.totalCost ? Number(v.totalCost).toLocaleString('en-IN') : '0'}</div></div>
                <div style="background:#FEF2F2; padding:10px; border-radius:12px; border:1px solid #fecaca;"><label style="display:block; font-size:0.6rem; font-weight:800; color:#dc2626;">PAYMENT STATUS</label><div style="font-weight:700; font-size:0.8rem; color:#dc2626;">Paid: ₹${v.collected || 0} | Pending: ₹${v.pending || 0}</div></div>
            </div>

            <div style="margin-top:15px; background: #fdfdfd; padding: 10px; border-radius: 12px; border: 1px dashed #eee;">
                <label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">CATERING / LINKEDIN</label>
                <div style="font-weight:700; font-size:0.8rem; word-break:break-word;">Food: ${v.foodPref || 'N/A'} | LinkedIn: ${v.linkedin ? `<a href="${v.linkedin}" target="_blank" rel="noopener noreferrer" style="color:#0A66C2;">Profile Link</a>` : 'N/A'}</div>
            </div>

            <div style="margin-top:15px; border-top:1px solid #EEE; padding-top:10px;">
                <label style="display:block; font-size:0.6rem; font-weight:800; color:var(--accent-gold);">PROJECT MANAGER LOGS</label>
                <div style="font-size:0.85rem; background:#F1F5F9; padding:12px; border-radius:12px; margin-top:5px; white-space:pre-wrap; word-break:break-word;">${v.pmComment || "No logs recorded yet."}</div>
            </div>`;

        document.getElementById('custom-modal').classList.add('modal-active');
        document.getElementById('custom-modal').classList.remove('hidden');
    }

    function save() {
        localStorage.setItem('swasya_v101', JSON.stringify(visits));
    }

    function changeMonth(dir) {
        currentViewDate.setMonth(currentViewDate.getMonth() + dir);
        updateUI();
    }

    function focusDate(date) {
        selectedDate = date;
        document.getElementById('c-checkin').value = date;
        updateCheckOutMin();
        updateUI();
    }

    function closeModal() {
        document.getElementById('custom-modal').classList.add('hidden');
        document.getElementById('custom-modal').classList.remove('modal-active');
    }

    function exportAuditToExcel() {
        let csv = "CheckIn,CheckOut,Nights,Client,Phone,Adults,Kids,TotalPax,CustType,TotalCost,Collected,Pending,LinkedIn,FoodPreference,Unit,UnitsCount,Project,Manager,Status,PM Comment\n";
        visits.forEach(v => {
            csv += `${v.checkIn||v.date},${v.checkOut||''},${v.nights||1},${v.client},${v.phone},${v.adults||0},${v.kids||0},${v.pax},${v.custType||'N/A'},${v.totalCost||0},${v.collected||0},${v.pending||0},${v.linkedin||''},${v.foodPref || 'N/A'},${v.unitType},${v.unitsCount||1},${v.proj},${v.manager},${v.status},"${(v.pmComment || '').replace(/"/g, '""')}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Swasya_Audit_2026.csv`;
        a.click();
    }
</script>
</body>
</html>
